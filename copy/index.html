<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Copy Của Amy</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #fdf8f0;
    color: #3a2e22;
    margin: 0;
    padding: 40px 20px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e8dcc8;
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 4px 18px rgba(120, 90, 40, 0.08);
  }
  h1 {
    text-align: center;
    font-size: 2.2rem;
    color: #8a5a1d;
    letter-spacing: 1px;
    margin: 0 0 8px 0;
  }
  .updated {
    text-align: center;
    font-size: 1.1rem;
    color: #7a6a55;
    margin: 0 0 28px 0;
  }
  .instruction {
    font-size: 1.35rem;
    background: #fdf3e0;
    border-left: 6px solid #d9a441;
    border-radius: 8px;
    padding: 16px 20px;
    margin: 0 0 28px 0;
  }
  .copybox {
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 1.6rem;
    background: #fffdf7;
    border: 3px solid #d9a441;
    border-radius: 12px;
    padding: 26px 24px;
    text-align: center;
    margin: 0 0 32px 0;
  }
  footer {
    text-align: center;
    font-size: 1rem;
    color: #8a7a63;
    border-top: 1px solid #eee2cc;
    padding-top: 18px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>BẢNG COPY CỦA AMY</h1>
    <p class="updated">Cập nhật: 15/11/2026</p>

    <p class="instruction">Bôi đen dòng tiếng Anh trong khung → bấm Ctrl+C → qua Antigravity bấm Ctrl+V → Enter</p>

    <div class="copybox">Please continue from where you stopped. Take your time, I will wait.</div>

    <footer>Trang này là bảng copy của Amy dành cho chị Titi — nội dung mới nhất luôn ở đây.</footer>
  </div>
</body>
</html>
